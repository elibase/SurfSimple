<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SurfSimple Settings</title>
  <style>
    :root {
      --color-primary: #1a6fc4;
      --color-primary-dark: #145499;
      --color-bg: #f5f8ff;
      --color-surface: #ffffff;
      --color-text: #1a1a2e;
      --color-muted: #55557a;
      --color-border: #d0d8ee;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-bg);
      padding: 40px 24px 80px;
    }

    .container { max-width: 640px; margin: 0 auto; }

    .page-header { margin-bottom: 36px; }
    h1 { font-size: 1.75rem; color: var(--color-primary); margin-bottom: 4px; }
    .subtitle { color: var(--color-muted); font-size: 1rem; }

    .field { margin-bottom: 24px; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--color-primary);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--color-primary);
      margin-top: 4px;
    }

    .range-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .range-value {
      font-weight: 700;
      color: var(--color-primary);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-row label {
      margin-bottom: 0;
      font-weight: 400;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--color-primary);
      flex-shrink: 0;
    }

    select {
      padding: 10px 14px;
      font-size: 1rem;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
    }

    select:focus { border-color: var(--color-primary); }

    .btn-save {
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .btn-save:hover { background: var(--color-primary-dark); }
    .btn-save:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 3px; }

    .toast {
      display: none;
      margin-top: 14px;
      padding: 10px 16px;
      background: #eafaf1;
      border-left: 4px solid #27ae60;
      border-radius: 4px;
      color: #1e8449;
      font-size: 0.95rem;
    }

    .toast.visible { display: block; }

    details {
      margin-top: 36px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      background: var(--color-surface);
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--color-muted);
      list-style: none;
    }

    summary::before { content: '▶ '; font-size: 0.75em; }
    details[open] summary::before { content: '▼ '; }

    .hint {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-top: 5px;
    }

    hr { border: none; border-top: 1px solid var(--color-border); margin: 28px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>SurfSimple Settings</h1>
      <p class="subtitle">Customise your web companion experience.</p>
    </div>

    <div class="field">
      <label for="elevenLabsKey">ElevenLabs API Key</label>
      <input type="password" id="elevenLabsKey" placeholder="sk-…" autocomplete="off" />
      <p class="hint">Required for voice features. Get your key at elevenlabs.io.</p>
    </div>

    <hr />

    <div class="field">
      <div class="range-label">
        <label for="voiceSpeed">Voice Speed</label>
        <span class="range-value" id="voiceSpeedDisplay">1.0×</span>
      </div>
      <input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1.0" />
    </div>

    <hr />

    <div class="field">
      <div class="toggle-row">
        <input type="checkbox" id="autoSummarise" />
        <label for="autoSummarise">Automatically summarise pages when I navigate to them</label>
      </div>
    </div>

    <div class="field">
      <div class="toggle-row">
        <input type="checkbox" id="highlightOnNav" />
        <label for="highlightOnNav">Highlight interactive elements on new pages</label>
      </div>
    </div>

    <hr />

    <div class="field">
      <label for="fontSize">Text Size</label>
      <select id="fontSize">
        <option value="medium">Medium (18 px)</option>
        <option value="large">Large (22 px)</option>
        <option value="xlarge">Extra Large (26 px)</option>
      </select>
    </div>

    <button class="btn-save" id="saveBtn">Save Settings</button>
    <div class="toast" id="toast" role="status">Settings saved!</div>

    <details>
      <summary>Advanced — Developer Options</summary>
      <div class="field" style="margin-top:16px">
        <label for="proxyUrlOverride">Proxy URL Override</label>
        <input type="text" id="proxyUrlOverride" placeholder="http://localhost:3001" autocomplete="off" />
        <p class="hint">Leave blank to use the default proxy. Only change this if you are running a local development proxy.</p>
      </div>
    </details>
  </div>

  <script src="options.js"></script>
</body>
</html>
